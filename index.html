<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Labq 공고 맞춤 발송 신청</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
    line-height: 1.6;
  }
  .container {
    max-width: 560px;
    margin: 40px auto;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    overflow: hidden;
  }
  .header {
    background: #f8f9fa;
    text-align: center;
    padding: 28px 20px 20px;
    border-bottom: 1px solid #eee;
  }
  .header h1 { font-size: 20px; margin-top: 8px; }
  .header p { font-size: 13px; color: #666; margin-top: 6px; }
  form { padding: 28px 32px 36px; }
  .field { margin-bottom: 22px; }
  label.title { display: block; font-weight: 700; font-size: 14px; margin-bottom: 6px; }
  label.title .req { color: #e53935; }
  .hint { font-size: 12px; color: #888; margin-bottom: 8px; }
  input[type=text], input[type=tel], select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 14px;
  }
  input:focus, select:focus { outline: none; border-color: #1a73e8; }
  .checks { display: flex; flex-wrap: wrap; gap: 8px 16px; }
  .checks label {
    display: flex; align-items: center; gap: 6px;
    font-size: 14px; cursor: pointer;
  }
  #naraDetail {
    display: none;
    margin-top: 12px;
    padding: 12px 14px;
    background: #f8f9fa;
    border-radius: 8px;
  }
  button[type=submit] {
    width: 100%;
    padding: 14px;
    background: #1a73e8;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 6px;
  }
  button[type=submit]:hover { background: #1558b8; }
  button[type=submit]:disabled { background: #9bb8e8; cursor: default; }
  .result { margin-top: 16px; font-size: 14px; text-align: center; display: none; padding: 12px; border-radius: 8px; }
  .result.ok { display: block; background: #e6f4ea; color: #137333; }
  .result.err { display: block; background: #fce8e6; color: #c5221f; }
</style>
</head>

    <h1>입찰/조달 공고 맞춤 발송 요청</h1>
    <p>신청 즉시 오늘 공고를 보내드리고, 이후 매일 오전 8시에 조건에 맞는 공고를 보내드립니다.<br>
    문의사항은 <a href="mailto:labq@labq.kr">labq@labq.kr</a>로 남겨주세요.</p>
  </div>

  <form id="applyForm" autocomplete="off">
    <div class="field">
      <label class="title">사업명 필터링 키워드</label>
      <div class="hint">검색하고자 하는 사업의 키워드를 쉼표(,)로 구분해 입력해주세요. 비워두면 전체 공고를 받습니다.</div>
      <input type="text" name="keywords" placeholder="예: 인공지능, AI, 생성형">
    </div>

    <div class="field">
      <label class="title">받을 공고의 종류 <span class="req">*</span></label>
      <div class="checks" id="orgTypeChecks"></div>
    </div>

    <div class="field" id="naraDetailWrap">
      <div id="naraDetail">
        <label class="title">나라장터 세부 종류</label>
        <div class="checks" id="naraTypeChecks"></div>
      </div>
    </div>

    <div class="field">
      <label class="title">사업예산 규모 <span class="req">*</span></label>
      <div class="hint">선택한 규모 미만의 공고만 받습니다.</div>
      <div class="checks">
        <label><input type="radio" name="budget" value="5억 미만">5억 미만</label>
        <label><input type="radio" name="budget" value="20억 미만">20억 미만</label>
        <label><input type="radio" name="budget" value="40억 미만">40억 미만</label>
        <label><input type="radio" name="budget" value="모두" checked>모두</label>
      </div>
    </div>

    <div class="field">
      <label class="title">이름 <span class="req">*</span></label>
      <input type="text" name="name" required placeholder="예: 김랩큐">
    </div>

    <div class="field">
      <label class="title">소속 기관 또는 회사명 <span class="req">*</span></label>
      <input type="text" name="organization" required placeholder="예: LabQ, 개인">
    </div>

    <div class="field">
      <label class="title">연락 가능한 전화번호 <span class="req">*</span></label>
      <div class="hint">숫자만 입력해주세요.</div>
      <input type="tel" name="phone" required inputmode="numeric" pattern="[0-9]{9,11}" placeholder="예: 01012345678">
    </div>

    <div class="field">
      <label class="title">발송을 요청할 이메일 <span class="req">*</span></label>
      <div class="hint">여러 개인 경우 쉼표(,)로 구분해주세요.</div>
      <input type="text" name="emails" required placeholder="예: khs@labq.kr, labq@labq.kr">
    </div>

    <div class="field">
      <label class="title">수신 기간</label>
      <div class="hint">선택하지 않으면 1개월간 공고를 수신합니다.</div>
      <select name="period">
        <option value="1개월">1개월</option>
        <option value="2개월">2개월</option>
        <option value="3개월">3개월</option>
      </select>
    </div>

    <button type="submit" id="submitBtn">신청하기</button>
    <div class="result" id="result"></div>
  </form>
</div>

<script>
// ── 설정 ─────────────────────────────────────
// Apps Script 배포 후 발급되는 웹 앱 URL로 교체하세요
const SCRIPT_URL = 'https://script.google.com/macros/s/배포ID/exec';

// 기존 구글폼(V4/V5) 선택지와 동일하게 유지 (dailySend 필터링에 그대로 쓰입니다)
const ORG_TYPES = ['나라장터', 'NIPA', 'NIA'];
const NARA_TYPES = ['본공고', '사전공고', '발주계획'];
// ─────────────────────────────────────────────

const orgTypeChecks = document.getElementById('orgTypeChecks');
const naraTypeChecks = document.getElementById('naraTypeChecks');
const naraDetail = document.getElementById('naraDetail');

ORG_TYPES.forEach(t => {
  orgTypeChecks.insertAdjacentHTML('beforeend',
    `<label><input type="checkbox" name="orgTypes" value="${t}">${t}</label>`);
});
NARA_TYPES.forEach(t => {
  naraTypeChecks.insertAdjacentHTML('beforeend',
    `<label><input type="checkbox" name="naraTypes" value="${t}">${t}</label>`);
});

// 나라장터 체크 시 세부 종류 표시
orgTypeChecks.addEventListener('change', () => {
  const naraChecked = [...document.querySelectorAll('input[name=orgTypes]:checked')]
    .some(c => c.value === '나라장터');
  naraDetail.style.display = naraChecked ? 'block' : 'none';
});

document.getElementById('applyForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const btn = document.getElementById('submitBtn');
  const result = document.getElementById('result');
  result.className = 'result';

  const orgTypes = [...form.querySelectorAll('input[name=orgTypes]:checked')].map(c => c.value);
  const naraTypes = [...form.querySelectorAll('input[name=naraTypes]:checked')].map(c => c.value);

  if (orgTypes.length === 0) {
    result.className = 'result err';
    result.textContent = '공고 종류를 하나 이상 선택해주세요.';
    return;
  }

  const naraSelected = orgTypes.includes('나라장터') ? '예' : '아니오';

  const params = new URLSearchParams({
    keywords: form.keywords.value.trim(),
    orgTypes: orgTypes.join(', '),
    naraSelected: naraSelected,
    naraTypes: naraSelected === '예' ? naraTypes.join(', ') : '',
    budget: form.budget.value,
    name: form.name.value.trim(),
    organization: form.organization.value.trim(),
    phone: form.phone.value.trim(),
    emails: form.emails.value.trim(),
    period: form.period.value
  });

  btn.disabled = true;
  btn.textContent = '신청 처리 중...';

  try {
    const res = await fetch(SCRIPT_URL, { method: 'POST', body: params });
    const json = await res.json();
    if (json.ok) {
      result.className = 'result ok';
      result.textContent = '신청이 완료되었습니다! 확인 메일과 오늘의 공고를 곧 보내드립니다.';
      form.reset();
      naraDetail.style.display = 'none';
    } else {
      result.className = 'result err';
      result.textContent = '신청 실패: ' + (json.error || '알 수 없는 오류');
    }
  } catch (err) {
    result.className = 'result err';
    result.textContent = '전송 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.';
  } finally {
    btn.disabled = false;
    btn.textContent = '신청하기';
  }
});
</script>
